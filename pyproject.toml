[project]
name = "agentflow"
version = "0.1.0"
description = "Agent Flow — multi-agent website builder demo (OpenRouter free models only)"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai>=0.0.14",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "slack-bolt>=1.20",
    "aiohttp>=3.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "anyio>=4.0",
]

[project.scripts]
agentflow = "agentflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
